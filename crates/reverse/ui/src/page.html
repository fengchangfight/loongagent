<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>loongagent · 逆向研究</title>
<style>
  :root {
    --bg: #12141a; --panel: #191c24; --line: #262b36; --fg: #dfe3ec;
    --dim: #8b93a7; --accent: #6fb3ff; --ok: #62d18a; --warn: #f0c674; --bad: #f2777a;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 15px/1.5 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         display: flex; flex-direction: column; height: 100vh; }
  header { display: flex; gap: 16px; align-items: baseline; padding: 10px 16px;
           border-bottom: 1px solid var(--line); background: var(--panel); }
  header b { color: var(--accent); font-weight: 600; }
  header .meta { color: var(--dim); font-size: 13px; }
  header nav { margin-left: auto; display: flex; gap: 8px; }
  header nav a { color: var(--dim); text-decoration: none; padding: 4px 10px;
                 border: 1px solid var(--line); border-radius: 6px; font-size: 13px; }
  header nav a.here { color: var(--accent); border-color: var(--accent); }

  /* ① 选择目标：最上面、最醒目。三种类型分开，因为第一步的工具不同。 */
  #target { padding: 14px 16px 16px; border-bottom: 1px solid var(--line); background: #14161d; }
  .stephead { display: flex; gap: 10px; align-items: baseline; margin-bottom: 10px; }
  .stephead .no { font-family: var(--mono); font-size: 12px; color: var(--bg);
                  background: var(--accent); border-radius: 50%; width: 20px; height: 20px;
                  display: inline-flex; align-items: center; justify-content: center;
                  font-weight: 700; }
  .stephead h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .stephead .hint { color: var(--dim); font-size: 12px; }
  #kinds { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  #kinds button { font: inherit; font-size: 13px; padding: 7px 16px; border-radius: 7px;
                  border: 1px solid var(--line); background: #1d212b; color: var(--dim);
                  cursor: pointer; }
  #kinds button:hover { border-color: var(--accent); color: var(--fg); }
  #kinds button.on { border-color: var(--accent); color: var(--bg); background: var(--accent);
                     font-weight: 600; }
  #targetrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #value { flex: 1; min-width: 320px; padding: 9px 12px; font: inherit; font-size: 13px;
           font-family: var(--mono); color: var(--fg); background: #0f1116;
           border: 1px solid var(--line); border-radius: 7px; outline: none; }
  #value:focus { border-color: var(--accent); }
  #targetrow button { font: inherit; font-size: 13px; padding: 9px 16px; border-radius: 7px;
                      border: 1px solid var(--line); background: #2b3040; color: var(--fg);
                      cursor: pointer; }
  #targetrow button:hover { border-color: var(--accent); color: var(--accent); }
  #target-status { margin-top: 8px; font-size: 12px; color: var(--dim); min-height: 18px; }
  #target-status.ok { color: var(--ok); }
  #target-status.bad { color: var(--bad); }

  /* ② 工作流：两步，研究在前，重构在后，中间有门。 */
  #workflow { display: flex; gap: 14px; align-items: stretch; padding: 14px 16px;
              border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  .step { flex: 1; min-width: 260px; border: 1px solid var(--line); border-radius: 10px;
          padding: 12px 14px; background: #1d212b; display: flex; flex-direction: column;
          gap: 8px; }
  .step.done { border-color: var(--ok); }
  .step.locked { opacity: 0.55; }
  .step .title { display: flex; gap: 8px; align-items: center; font-size: 14px;
                 font-weight: 600; }
  .step .title .no { font-family: var(--mono); font-size: 11px; color: var(--bg);
                     background: var(--dim); border-radius: 50%; width: 18px; height: 18px;
                     display: inline-flex; align-items: center; justify-content: center; }
  .step.done .title .no, .step.ready .title .no { background: var(--ok); color: var(--bg); }
  .step .what { color: var(--dim); font-size: 12px; flex: 1; }
  .step button { font: inherit; font-size: 13px; padding: 8px 14px; border-radius: 7px;
                 border: 1px solid var(--line); background: #2b3040; color: var(--fg);
                 cursor: pointer; }
  .step button.primary { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .step button.primary:hover { background: var(--accent); color: var(--bg); }
  .step button.ghost { border-color: var(--ok); color: var(--ok); }
  .step button:disabled { cursor: not-allowed; border-color: var(--line); color: var(--dim);
                          background: #191c24; }
  .arrow { align-self: center; color: var(--dim); font-size: 20px; }
  #gateline { flex-basis: 100%; font-size: 12px; color: var(--dim); }
  #gateline.ready { color: var(--ok); }

  main { display: grid; grid-template-columns: 240px 1fr 1fr; flex: 1; min-height: 0; }
  .pane { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .pane:last-child { border-right: 0; }
  .pane h3 { margin: 0; padding: 8px 12px; font-size: 12px; letter-spacing: 0.08em;
             color: var(--dim); border-bottom: 1px solid var(--line);
             display: flex; gap: 8px; align-items: center; }
  .pane h3 button { margin-left: auto; font: inherit; font-size: 12px; padding: 2px 10px;
                    border-radius: 5px; border: 1px solid var(--line); background: #2b3040;
                    color: var(--fg); cursor: pointer; }
  #tree { overflow: auto; font-family: var(--mono); font-size: 13px; padding: 8px 0; flex: 1; }
  #tree a { display: block; color: var(--fg); text-decoration: none; padding: 2px 12px;
            white-space: nowrap; }
  #tree a:hover { background: #20222c; }
  #tree a.dir { color: var(--dim); }
  #preview { overflow: auto; flex: 1; padding: 12px 16px; font-family: var(--mono);
             font-size: 13px; white-space: pre-wrap; word-break: break-word; }
  #chat { overflow: auto; flex: 1; padding: 12px; }
  .row { margin: 0 0 8px; white-space: pre-wrap; word-break: break-word; }
  .you { color: var(--accent); }
  .say { color: var(--fg); }
  .note { color: var(--dim); font-size: 13px; }
  .bad { color: var(--bad); }
  footer { padding: 8px 12px; border-top: 1px solid var(--line); background: var(--panel); }
  #prompt { width: 100%; padding: 8px 10px; font: inherit; color: var(--fg);
            background: #14161d; border: 1px solid var(--line); border-radius: 6px; outline: none; }

  /* 选文件的目录浏览器：浏览器不给完整路径，只能自己列。 */
  #picker { position: fixed; inset: 10% 15% auto 15%; max-height: 70vh; display: none;
            flex-direction: column; background: var(--panel); border: 1px solid var(--line);
            border-radius: 10px; box-shadow: 0 18px 50px #000a; overflow: hidden; z-index: 10; }
  #picker.open { display: flex; }
  #picker header { border-bottom: 1px solid var(--line); }
  #picker-path { flex: 1; font-family: var(--mono); font-size: 13px; color: var(--accent);
                 overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #picker-list { overflow: auto; font-family: var(--mono); font-size: 13px; padding: 6px 0; }
  #picker-list a { display: block; padding: 3px 14px; color: var(--fg); text-decoration: none;
                   white-space: nowrap; cursor: pointer; }
  #picker-list a:hover { background: #20222c; }
  #picker-list a.dir { color: var(--accent); }
  #picker footer { display: flex; gap: 8px; align-items: center; }
  #picker footer .grow { flex: 1; }
</style>
</head>
<body>
<header>
  <b>loongagent</b>
  <span class="meta">逆向研究</span>
  <span class="meta" id="session">连接中…</span>
  <nav>
    <a href="/#token=" id="tab-chat">聊天</a>
    <a href="/reverse" class="here">逆向研究</a>
  </nav>
</header>

<section id="target">
  <div class="stephead">
    <span class="no">1</span>
    <h2>选择目标</h2>
    <span class="hint">先定下要看什么，再开始研究。三种目标打开方式不同。</span>
  </div>
  <div id="kinds">
    <button type="button" data-kind="binary">程序文件</button>
    <button type="button" data-kind="apk">Android APK</button>
    <button type="button" data-kind="url">网站</button>
  </div>
  <div id="targetrow">
    <input id="value" autocomplete="off" spellcheck="false">
    <button id="btn-pick" type="button">浏览…</button>
    <button id="btn-save" type="button">确认目标</button>
  </div>
  <div id="target-status">还没有选定目标。</div>
</section>

<section id="workflow">
  <div class="step" id="step-study">
    <div class="title"><span class="no">1</span>研究</div>
    <div class="what">把目标查清楚：是什么、怎么运行、结构如何。结论写进 <code>.reverse/study/</code> 里的研究笔记。</div>
    <button class="primary" id="btn-study" type="button">开始研究</button>
  </div>
  <div class="arrow">→</div>
  <div class="step locked" id="step-build">
    <div class="title"><span class="no">2</span>重构</div>
    <div class="what">按研究笔记重写一份功能等价的实现，产物落在 <code>.reverse/build/</code>。研究没完成前不能开始。</div>
    <button id="btn-build" type="button" disabled>开始重构</button>
  </div>
  <div id="gateline">研究跑完后，点下面的按钮才算研究完成——重构那一步才会解锁。</div>
  <div style="flex-basis:100%">
    <button id="btn-done" type="button" class="ghost"
            style="font:inherit;font-size:13px;padding:8px 14px;border-radius:7px;border:1px solid var(--ok);background:#2b3040;color:var(--ok);cursor:pointer">
      标记研究完成
    </button>
  </div>
</section>

<main>
  <section class="pane">
    <h3>.reverse/ <button id="btn-refresh" type="button">刷新</button></h3>
    <div id="tree"></div>
  </section>
  <section class="pane">
    <h3>文件预览 <span class="meta" id="preview-name"></span></h3>
    <div id="preview">点左边的文件名，在这里看内容。</div>
  </section>
  <section class="pane">
    <h3>对话</h3>
    <div id="chat"></div>
    <footer><input id="prompt" placeholder="跟这个会话说点什么…" autocomplete="off"></footer>
  </section>
</main>

<div id="picker">
  <header>
    <b>选择目标</b>
    <span id="picker-path"></span>
  </header>
  <div id="picker-list"></div>
  <footer>
    <button id="btn-up" type="button">↑ 上一层</button>
    <button id="btn-use-dir" type="button">用这个目录</button>
    <span class="grow"></span>
    <button id="btn-cancel" type="button">取消</button>
  </footer>
</div>

<script>
(() => {
  const token = new URLSearchParams(location.hash.replace(/^#/, "")).get("token") || "";
  const tree = document.getElementById("tree");
  const preview = document.getElementById("preview");
  const previewName = document.getElementById("preview-name");
  const chatlog = document.getElementById("chat");
  const input = document.getElementById("prompt");
  const sessionLabel = document.getElementById("session");
  const valueInput = document.getElementById("value");
  const targetStatus = document.getElementById("target-status");
  const picker = document.getElementById("picker");
  const pickerPath = document.getElementById("picker-path");
  const pickerList = document.getElementById("picker-list");
  const btnStudy = document.getElementById("btn-study");
  const btnBuild = document.getElementById("btn-build");
  const btnDone = document.getElementById("btn-done");
  const btnPick = document.getElementById("btn-pick");
  const stepStudy = document.getElementById("step-study");
  const stepBuild = document.getElementById("step-build");
  const gateline = document.getElementById("gateline");
  document.getElementById("tab-chat").href = "/#token=" + encodeURIComponent(token);

  const HINTS = {
    binary: "粘贴可执行文件的完整路径，例如 /home/you/app.elf",
    apk: "粘贴 APK 的完整路径，例如 /home/you/app.apk",
    url: "粘贴网址，例如 https://example.com",
  };
  const NAMES = { binary: "程序文件", apk: "Android APK", url: "网站" };

  const escape = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  function row(html, cls) {
    const el = document.createElement("div");
    el.className = "row " + (cls || "");
    el.innerHTML = html;
    chatlog.appendChild(el);
    chatlog.scrollTop = chatlog.scrollHeight;
  }
  // Every data route of the surface needs the token; the page keeps it in memory only.
  function api(path, init) {
    const options = Object.assign({}, init || {});
    options.headers = Object.assign({ "x-loong-token": token }, options.headers || {});
    return fetch(path, options);
  }
  function say(text, kind) {
    targetStatus.textContent = text;
    targetStatus.className = kind || "";
  }

  // ---- ① 目标：三个标签，类型决定第一步用哪个工具 --------------------------
  let kind = "binary";
  let target = "";

  function setKind(next) {
    kind = next;
    for (const button of document.querySelectorAll("#kinds button")) {
      button.classList.toggle("on", button.dataset.kind === next);
    }
    valueInput.placeholder = HINTS[next];
    // 网址不是文件，没有可浏览的目录。
    btnPick.style.display = next === "url" ? "none" : "";
    if (target) say("已选定：" + target + "（" + NAMES[next] + "）", "ok");
  }
  for (const button of document.querySelectorAll("#kinds button")) {
    button.onclick = () => setKind(button.dataset.kind);
  }

  async function loadTarget() {
    const answer = await api("/reverse/target");
    if (!answer.ok) return;
    const lines = (await answer.text()).split("\n");
    const savedKind = (lines[0] || "").trim();
    const savedValue = (lines[1] || "").trim();
    if (savedValue) {
      target = savedValue;
      valueInput.value = savedValue;
      setKind(NAMES[savedKind] ? savedKind : "binary");
      say("沿用上次的目标：" + savedValue + "（" + NAMES[kind] + "）", "ok");
    } else {
      setKind("binary");
    }
  }

  async function saveTarget() {
    const chosen = valueInput.value.trim();
    if (!chosen) { say("请先填写目标", "bad"); return false; }
    const answer = await api("/reverse/target", { method: "POST", body: kind + "\n" + chosen });
    const text = (await answer.text()).trim();
    if (!answer.ok) { say(text, "bad"); return false; }
    const lines = text.split("\n");
    target = (lines[1] || "").trim() || chosen;
    valueInput.value = target;
    say("已选定：" + target + "（" + NAMES[kind] + "）", "ok");
    refreshGate();
    return true;
  }
  document.getElementById("btn-save").onclick = saveTarget;
  valueInput.addEventListener("keydown", (event) => {
    if (event.key === "Enter") { event.preventDefault(); saveTarget(); }
  });

  // ---- ② 工作流：研究 → 重构，第二步等用户点“标记研究完成” -----------------
  let studyDone = false;

  function refreshGate() {
    stepStudy.classList.toggle("done", studyDone);
    stepBuild.classList.toggle("locked", !studyDone);
    stepBuild.classList.toggle("ready", studyDone && !!target);
    btnBuild.disabled = !(studyDone && !!target);
    btnBuild.title = btnBuild.disabled ? "先完成研究，再点「标记研究完成」" : "";
    btnDone.textContent = studyDone ? "研究已完成（点此撤销）" : "标记研究完成";
    gateline.textContent = studyDone
      ? "研究已完成，重构已解锁：可以点「开始重构」了。"
      : "研究跑完后，点下面的按钮才算研究完成——重构那一步才会解锁。";
    gateline.classList.toggle("ready", studyDone);
  }

  async function loadPhase() {
    const answer = await api("/reverse/phase");
    if (!answer.ok) return;
    studyDone = (await answer.text()).trim() === "done";
    refreshGate();
  }

  async function setPhase(done) {
    const answer = await api("/reverse/phase", { method: "POST", body: done ? "done" : "todo" });
    if (!answer.ok) { row(escape(await answer.text()), "bad"); return; }
    studyDone = (await answer.text()).trim() === "done";
    refreshGate();
  }
  btnDone.onclick = () => setPhase(!studyDone);

  // The prompts stay English on purpose: the model follows English instructions more
  // reliably, and the page already translates the *user's* side (docs/design/reverse.md §4).
  const STUDY = {
    binary: (t) => "Open the program at " + t + " with core_target_open (it takes an absolute "
      + "local path), then run core_target_triage to see what it is. Study it with the native "
      + "tools (sections, strings, functions, call graph, decompilation) and enable further "
      + "toolsets as needed. Write what you learn into .reverse/study/: 00-overview.md (what it "
      + "is, how it runs, its stack), 01-architecture.md (structure) and 02-findings.md (key "
      + "findings, each citing the evidence it rests on). Do not declare the study finished; "
      + "the user decides that.",
    apk: (t) => "Open the Android package at " + t + " with core_target_open (it takes an "
      + "absolute local path). Then use android_package_show for package name, permissions and "
      + "signature, android_components_list for activities/services/receivers/providers, and "
      + "android_classes_find / android_class_show / android_method_show / android_resources_read "
      + "on demand. The bytecode is smali: never claim Java level decompilation. Write what you "
      + "learn into .reverse/study/: 00-overview.md, 01-architecture.md, 02-findings.md. Do not "
      + "declare the study finished; the user decides that.",
    url: (t) => "Open the website " + t + " with web_site_open. It does NOT go through "
      + "core_target_open, which only takes local absolute paths. Once open, use web_pages_list, "
      + "web_page_show, web_modules_trace and web_scripts_save to read the page, its scripts and "
      + "the module graph, and web_site_capture to save the evidence (screenshot, rendered HTML, "
      + "design tokens, assets, links and forms) into a folder. Finish with web_site_close. Write "
      + "what you learn into .reverse/study/: 00-overview.md, 01-architecture.md, 02-findings.md, "
      + "naming the capture folder each finding came from. Do not declare the study finished; the "
      + "user decides that.",
  };
  const BUILD = "Read every note in .reverse/study/ and rebuild the project it describes: a "
    + "functionally equivalent implementation written under .reverse/build/. Choose a sensible "
    + "stack unless the user says otherwise. Then say where it landed and what works.";

  btnStudy.onclick = async () => {
    if (!(await saveTarget())) return;
    // Continuing the study means the conclusion is not settled any more.
    if (studyDone) await setPhase(false);
    prompt(STUDY[kind](target));
  };
  btnBuild.onclick = async () => {
    if (!studyDone) { row("研究还没标记完成，重构不能开始。", "bad"); return; }
    if (!(await saveTarget())) return;
    prompt(BUILD);
  };

  // ---- the picker: a directory browser the server answers -------------------
  let picking = "";
  async function openPicker(start) {
    picker.classList.add("open");
    await list(start || target || "");
  }
  function closePicker() { picker.classList.remove("open"); }
  async function list(dir) {
    const answer = await api("/reverse/ls?path=" + encodeURIComponent(dir || ""));
    if (!answer.ok) {
      pickerList.innerHTML = "";
      const err = document.createElement("a");
      err.textContent = (await answer.text()) || "这个目录读不了";
      err.className = "bad";
      pickerList.appendChild(err);
      return;
    }
    const listing = await answer.json();
    picking = listing.path;
    pickerPath.textContent = listing.path;
    pickerList.innerHTML = "";
    for (const entry of listing.entries) {
      const a = document.createElement("a");
      a.textContent = (entry.dir ? "▸ " : "   ") + entry.name;
      a.className = entry.dir ? "dir" : "";
      a.onclick = () => {
        if (entry.dir) { list(entry.path); return; }
        valueInput.value = entry.path;
        closePicker();
        saveTarget();
      };
      pickerList.appendChild(a);
    }
    if (!listing.entries.length) {
      const empty = document.createElement("a");
      empty.textContent = "   （空目录）";
      empty.className = "note";
      pickerList.appendChild(empty);
    }
  }
  btnPick.onclick = () => openPicker("");
  document.getElementById("btn-cancel").onclick = closePicker;
  document.getElementById("btn-up").onclick = async () => {
    const answer = await api("/reverse/ls?path=" + encodeURIComponent(picking));
    if (!answer.ok) return;
    const listing = await answer.json();
    if (listing.parent) list(listing.parent);
  };
  document.getElementById("btn-use-dir").onclick = async () => {
    if (!picking) return;
    valueInput.value = picking;
    closePicker();
    saveTarget();
  };
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") closePicker();
  });

  // ---- the session's own files ---------------------------------------------
  async function loadTree() {
    const answer = await api("/reverse/tree");
    if (!answer.ok) return;
    const entries = await answer.json();
    tree.innerHTML = "";
    for (const entry of entries) {
      const a = document.createElement("a");
      a.textContent = (entry.dir ? "▸ " : "  ") + entry.path;
      a.className = entry.dir ? "dir" : "";
      if (!entry.dir) {
        a.href = "#";
        a.onclick = () => openFile(entry.path);
      }
      tree.appendChild(a);
    }
    if (!entries.length) {
      const empty = document.createElement("a");
      empty.textContent = "  （还没有文件）";
      empty.className = "note";
      tree.appendChild(empty);
    }
  }
  document.getElementById("btn-refresh").onclick = loadTree;
  async function openFile(path) {
    const answer = await api("/reverse/file/" + path.split("/").map(encodeURIComponent).join("/"));
    previewName.textContent = path;
    if (!answer.ok) { preview.textContent = path + "：" + answer.status; return; }
    preview.textContent = await answer.text();
  }

  // ---- the chat pane: the portal's own socket ------------------------------
  let sessionId = "";
  const socket = new WebSocket(`ws://${location.host}/ws?token=${encodeURIComponent(token)}`);
  socket.onopen = () => {
    socket.send(JSON.stringify({ jsonrpc: "2.0", id: 1, method: "session.attach",
      params: { cwd: "", client: "web" } }));
  };
  socket.onmessage = (event) => {
    const message = JSON.parse(event.data);
    if (message.id === 1 && message.result) {
      sessionId = message.result.session_id;
      sessionLabel.textContent = "会话 " + sessionId;
      row("已连接。先在上面选定目标，再点「开始研究」。", "note");
      return;
    }
    if (message.method === "event") {
      const data = message.params.data || {};
      if (message.params.kind === "message.appended") {
        if (data.role === "user") row("<b>你</b> " + escape(data.text), "you");
        else if (data.text) row(escape(data.text), "say");
        if (data.role === "assistant") loadTree(); // 一轮可能写了研究笔记
      }
      return;
    }
    if (message.error) row(escape(message.error.message), "bad");
  };
  socket.onclose = () => row("连接已断开。", "bad");

  function prompt(text) {
    if (!text) return;
    if (!sessionId) { row("还没连上会话，等一两秒再点。", "bad"); return; }
    socket.send(JSON.stringify({ jsonrpc: "2.0", id: Date.now(), method: "prompt.submit",
      params: { session_id: sessionId, text } }));
  }
  input.addEventListener("keydown", (event) => {
    if (event.key !== "Enter") return;
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    prompt(text);
  });

  loadTarget();
  loadPhase();
  loadTree();
})();
</script>
</body>
</html>
