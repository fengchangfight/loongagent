# Protocol schema — the single source of truth (ADR-0002, ADR-0013).
#
# `scripts/gen-schema.py` reads this file and generates:
#   - crates/schema/src/generated.rs            (Rust types, serde derives)
#   - crates/schema/tests/generated_roundtrip.rs (generated conformance test)
#   - clients/ts/protocol.generated.ts          (TypeScript types for the web client)
#   - clients/ts/protocol.samples.json          (example payloads, generated)
#
# Never edit the generated files by hand. Adding a type is one entry here.
#
# Field `type` accepts: string | bool | i64 | u64 | json | <TypeName>
# (`list = true` wraps it in an array, `optional = true` makes it optional.)

schema_version = "0.1.0"

# ---------------------------------------------------------------- primitives

[[types]]
name = "Seq"
kind = "alias"
doc = "Monotonic event sequence within a session."
rust = "u64"
ts = "number"

[[types]]
name = "Millis"
kind = "alias"
doc = "Unix epoch milliseconds."
rust = "i64"
ts = "number"

[[types]]
name = "Json"
kind = "alias"
doc = "Opaque JSON payload (contents are schema-versioned by the event kind)."
rust = "serde_json::Value"
ts = "JsonValue"

# --------------------------------------------------------------------- enums

[[types]]
name = "ActionClass"
kind = "enum"
doc = "Autonomy classes — allocated per action, not per tool (ADR-0007 §4)."
variants = [
  { name = "Investigate", wire = "investigate", doc = "read-only; no prompt" },
  { name = "WriteWorkspace", wire = "write_workspace", doc = "edits inside the workspace" },
  { name = "OutOfBounds", wire = "out_of_bounds", doc = "network, outside the workspace, destructive, credentials" },
]

[[types]]
name = "Verdict"
kind = "enum"
doc = "PDP verdict, always accompanied by the rule that fired (ADR-0007 §1)."
variants = [
  { name = "Allow", wire = "allow" },
  { name = "Ask", wire = "ask" },
  { name = "Deny", wire = "deny" },
]

[[types]]
name = "ApprovalScope"
kind = "enum"
doc = "How far a granted approval reaches (ADR-0007 §6)."
variants = [
  { name = "Once", wire = "once" },
  { name = "ActionClass", wire = "action_class" },
  { name = "Project", wire = "project" },
]

[[types]]
name = "Role"
kind = "enum"
doc = "Who produced a conversation message."
variants = [
  { name = "User", wire = "user" },
  { name = "Assistant", wire = "assistant" },
  { name = "Tool", wire = "tool" },
  { name = "System", wire = "system" },
]

# ------------------------------------------------------------------- structs

[[types]]
name = "EventEnvelope"
kind = "struct"
doc = "One JSONL record (ADR-0003). `ignorable` is the forward-compatibility envelope: a reader that does not understand `kind` may skip the record when true, and MUST fail loudly when false."
fields = [
  { name = "seq", type = "Seq" },
  { name = "id", type = "string" },
  { name = "parent_id", type = "string", optional = true, doc = "event-tree parent (ADR-0015)" },
  { name = "kind", type = "string", doc = "event kind, e.g. message.appended" },
  { name = "ignorable", type = "bool" },
  { name = "time_ms", type = "Millis" },
  { name = "data", type = "Json" },
]

[[types]]
name = "MessageAppended"
kind = "struct"
fields = [
  { name = "role", type = "Role" },
  { name = "text", type = "string" },
]

[[types]]
name = "ToolCall"
kind = "struct"
fields = [
  { name = "call_id", type = "string" },
  { name = "tool", type = "string" },
  { name = "args", type = "Json" },
  { name = "action_class", type = "ActionClass" },
]

[[types]]
name = "ToolResult"
kind = "struct"
fields = [
  { name = "call_id", type = "string" },
  { name = "ok", type = "bool" },
  { name = "output", type = "string" },
]

[[types]]
name = "ApprovalRequested"
kind = "struct"
fields = [
  { name = "request_id", type = "string" },
  { name = "action_class", type = "ActionClass" },
  { name = "reason", type = "string", doc = "why the PDP asked; shown to the human" },
]

[[types]]
name = "ApprovalDecided"
kind = "struct"
fields = [
  { name = "request_id", type = "string" },
  { name = "granted", type = "bool" },
  { name = "scope", type = "ApprovalScope" },
  { name = "reason", type = "string", optional = true, doc = "fed back to the model (ADR-0007 §6)" },
]

[[types]]
name = "PolicyDecided"
kind = "struct"
doc = "Every PDP verdict is an event, with the rule that fired (ADR-0007 §1, §9)."
fields = [
  { name = "action_class", type = "ActionClass" },
  { name = "verdict", type = "Verdict" },
  { name = "rule", type = "string" },
]

[[types]]
name = "CostRecorded"
kind = "struct"
fields = [
  { name = "profile", type = "string" },
  { name = "tokens_in", type = "u64" },
  { name = "tokens_out", type = "u64" },
  { name = "usd_micros", type = "u64" },
]

[[types]]
name = "HookFired"
kind = "struct"
doc = "One hook answered at one lifecycle moment (ADR-0007 §7). Recorded whether or not it changed the outcome, so the guard's behaviour is auditable."
fields = [
  { name = "event", type = "string", doc = "the lifecycle moment: session_start, user_prompt_submit, pre_tool, post_tool, permission_requested, permission_decided" },
  { name = "hook_id", type = "string" },
  { name = "kind", type = "string", doc = "shell | http" },
  { name = "verdict", type = "Verdict" },
  { name = "reason", type = "string" },
  { name = "duration_ms", type = "Millis" },
  { name = "failed", type = "bool", doc = "the hook could not answer; the verdict came from its on_error policy" },
]

[[types]]
name = "CompactionApplied"
kind = "struct"
doc = "Visible compaction (ADR-0006 §4): stale tool output is cleared first, then the oldest exchanges are dropped. The newest window stays verbatim."
fields = [
  { name = "tokens_before", type = "u64" },
  { name = "tokens_after", type = "u64" },
  { name = "kept_tokens", type = "u64", doc = "the newest window left verbatim" },
  { name = "cleared_tool_outputs", type = "u64" },
  { name = "dropped_messages", type = "u64" },
  { name = "summary", type = "string" },
]

[[types]]
name = "SessionAttachParams"
kind = "struct"
fields = [
  { name = "cwd", type = "string" },
  { name = "client", type = "string", doc = "tui | web | acp" },
]

[[types]]
name = "SessionAttachResult"
kind = "struct"
fields = [
  { name = "session_id", type = "string" },
  { name = "schema_version", type = "string" },
  { name = "existing_events", type = "u64" },
]

[[types]]
name = "SessionReplayResult"
kind = "struct"
doc = "A session's recorded events, oldest first: what a client needs in order to show \"what happened before I arrived\"."
fields = [
  { name = "events", type = "json", list = true },
]

[[types]]
name = "PromptSubmitParams"
kind = "struct"
fields = [
  { name = "session_id", type = "string" },
  { name = "text", type = "string" },
]

[[types]]
name = "PromptSubmitResult"
kind = "struct"
fields = [
  { name = "turn_id", type = "u64" },
  { name = "accepted", type = "bool" },
]

[[types]]
name = "ApprovalRespondParams"
kind = "struct"
fields = [
  { name = "session_id", type = "string" },
  { name = "request_id", type = "string" },
  { name = "granted", type = "bool" },
  { name = "scope", type = "ApprovalScope" },
  { name = "reason", type = "string", optional = true },
]

[[types]]
name = "RpcError"
kind = "struct"
doc = "JSON-RPC 2.0 error object."
fields = [
  { name = "code", type = "i64" },
  { name = "message", type = "string" },
  { name = "data", type = "Json", optional = true },
]

# ------------------------------------------------------------------- methods

[[types]]
name = "SessionOnlyParams"
kind = "struct"
doc = "A request about one session."
fields = [
  { name = "session_id", type = "string" },
]

[[types]]
name = "ContextEntry"
kind = "struct"
doc = "One thing in the model's context, and what it cost (ADR-0006)."
fields = [
  { name = "id", type = "u64" },
  { name = "category", type = "string", doc = "system_prompt | tools | rules | memory | mcp_tools | retrieval | history" },
  { name = "source", type = "string" },
  { name = "tokens", type = "u64" },
  { name = "lifetime", type = "string", doc = "turn | session | persistent" },
  { name = "pinned", type = "bool", doc = "never evicted" },
  { name = "cleared", type = "bool", doc = "its body was replaced by a marker to free context (ADR-0006 §4)" },
]

[[types]]
name = "ContextExplain"
kind = "struct"
doc = "What the model is actually being sent, and why. A debug view: the request for it changes nothing."
fields = [
  { name = "context_tokens", type = "u64" },
  { name = "budget_tokens", type = "u64", doc = "0 when there is no limit" },
  { name = "messages", type = "u64", doc = "how many messages the next request will carry" },
  { name = "tools", type = "u64", doc = "how many tool definitions it will carry" },
  { name = "compactions", type = "u64", doc = "how many compactions this session has recorded" },
  { name = "entries", type = "ContextEntry", list = true },
  { name = "categories", type = "ContextCategory", list = true, doc = "totals per category, largest first" },
]

[[types]]
name = "ContextCategory"
kind = "struct"
doc = "Token total for one category of context."
fields = [
  { name = "category", type = "string" },
  { name = "tokens", type = "u64" },
]

[[types]]
name = "ModelOffering"
kind = "struct"
doc = "One model a session can switch to, as a status bar needs it. No endpoint: a surface shows a name, and never learns where prompts go."
fields = [
  { name = "name", type = "string", doc = "the name the profile declared, which is what a switch names" },
  { name = "model", type = "string", doc = "the vendor's own model id" },
  { name = "provider", type = "string", optional = true, doc = "the catalog entry it came from, when it came from one" },
  { name = "context_window", type = "u64", optional = true, doc = "what the vendor reported, if anyone knows" },
]

[[types]]
name = "ModelList"
kind = "struct"
doc = "The models this session offers, in the order the configuration declared them, and which one is current."
fields = [
  { name = "models", type = "ModelOffering", list = true },
  { name = "selected", type = "string" },
]

[[types]]
name = "ModelSelectParams"
kind = "struct"
doc = "Switch the model a session uses. A person's choice, so it is recorded exactly as a routing rule's choice is."
fields = [
  { name = "session_id", type = "string" },
  { name = "name", type = "string", doc = "the name from model.list; an unknown name is refused, not stored" },
]

[[methods]]
name = "model.list"
doc = "The models this session can use and which is current. A read: it records nothing."
params = "SessionOnlyParams"
result = "ModelList"

[[methods]]
name = "model.select"
doc = "Choose the model for this session's next call. Recorded as a model.selected event, because a choice nobody can explain is a choice nobody can debug."
params = "ModelSelectParams"
result = "ModelList"

[[methods]]
name = "context.explain"
doc = "Explain the context the next request will carry: every entry, its category, its tokens, and what has been cleared."
params = "SessionOnlyParams"
result = "ContextExplain"

[[types]]
name = "SessionNewResult"
kind = "struct"
doc = "The session this server is now on, after `session.new`."
fields = [
  { name = "session_id", type = "string" },
]

[[methods]]
name = "session.new"
doc = "Start a fresh session and move this server onto it. Context starts empty; the previous session's log is closed and kept, never deleted — starting a new session must not be a way to lose an old one."
params = "SessionOnlyParams"
result = "SessionNewResult"

[[methods]]
name = "session.attach"
doc = "Attach a thin client to the local agent server (ADR-0009)."
params = "SessionAttachParams"
result = "SessionAttachResult"

[[types]]
name = "PermissionsSetParams"
kind = "struct"
doc = "Turn this session's approval prompts off or on. The sandbox is a different axis and is untouched (ADR-0007 §5)."
fields = [
  { name = "session_id", type = "string" },
  { name = "auto_approve", type = "bool", doc = "true: rulings that would ask are allowed instead, and the override is recorded" },
]

[[types]]
name = "PermissionsState"
kind = "struct"
fields = [
  { name = "auto_approve", type = "bool" },
]

[[methods]]
name = "permissions.set"
doc = "Opt out of approval prompts for this session. Opting out is itself an event, and the interface must show it (ADR-0007 §5)."
params = "PermissionsSetParams"
result = "PermissionsState"

[[methods]]
name = "session.replay"
doc = "Replay the session's own log, so an attaching client is not blind to its past. A read: it records nothing."
params = "SessionOnlyParams"
result = "SessionReplayResult"

[[methods]]
name = "prompt.submit"
doc = "Submit a user turn."
params = "PromptSubmitParams"
result = "PromptSubmitResult"

[[methods]]
name = "approval.respond"
doc = "Answer a pending approval request; recorded as an event either way (ADR-0007 §6)."
params = "ApprovalRespondParams"
result = "PromptSubmitResult"

# -------------------------------------------------------------------- events

[[types]]
name = "SessionForked"
kind = "struct"
doc = "A session's own record that it is a child: which session it came from, how, and where in that session. ADR-0015's second tree level. The child stores none of the parent's events — it references them."
fields = [
  { name = "origin", type = "string", doc = "fork | delegation | import" },
  { name = "parent_session", type = "string" },
  { name = "parent_seq", type = "u64", doc = "the parent's event the child continues from, inclusive" },
]

[[types]]
name = "TurnInterrupted"
kind = "struct"
doc = "The person stopped the turn. Recorded rather than merely reported: why a session has no answer is part of the session."
fields = [
  { name = "reason", type = "string", doc = "interrupted | budget | steps (the limits that end a turn early)" },
]

[[events]]
name = "turn.interrupted"
payload = "TurnInterrupted"
ignorable = false

[[types]]
name = "PermissionsRelaxed"
kind = "struct"
doc = "Approval prompts were turned off or on for this session. ADR-0007 §5: opting out is itself an event, and it travels with the session."
fields = [
  { name = "auto_approve", type = "bool" },
  { name = "reason", type = "string" },
]

[[events]]
name = "permissions.relaxed"
payload = "PermissionsRelaxed"
ignorable = false

[[events]]
name = "session.forked"
payload = "SessionForked"
ignorable = false

[[events]]
name = "message.appended"
payload = "MessageAppended"
ignorable = false

[[events]]
name = "tool.call"
payload = "ToolCall"
ignorable = false

[[events]]
name = "tool.result"
payload = "ToolResult"
ignorable = false

[[events]]
name = "approval.requested"
payload = "ApprovalRequested"
ignorable = false

[[events]]
name = "approval.decided"
payload = "ApprovalDecided"
ignorable = false

[[events]]
name = "policy.decided"
payload = "PolicyDecided"
ignorable = false

[[events]]
name = "cost.recorded"
payload = "CostRecorded"
ignorable = false

[[events]]
name = "compaction.applied"
payload = "CompactionApplied"
ignorable = false

[[types]]
name = "SkillsLoaded"
kind = "struct"
doc = "What the workspace offered as skills/commands (T-18). Names and descriptions enter context; bodies do not."
fields = [
  { name = "count", type = "u64" },
  { name = "tokens", type = "u64", doc = "size of the catalogue that entered context" },
  { name = "names", type = "string" },
  { name = "disabled", type = "string", doc = "names a lower-authority layer disabled by identity (ADR-0008 add-only rule), or empty" },
]

[[types]]
name = "SkillInvoked"
kind = "struct"
doc = "A skill or /command was invoked. The body became the prompt, and this names the file it came from."
fields = [
  { name = "name", type = "string" },
  { name = "source", type = "string" },
  { name = "args", type = "string" },
  { name = "tokens", type = "u64" },
  { name = "error", type = "string", optional = true, doc = "set when no such skill exists" },
]

[[events]]
name = "hook.fired"
payload = "HookFired"
ignorable = false

[[types]]
name = "ModelDelta"
kind = "struct"
doc = "A piece of an answer, as the model writes it. A transient notification, not an event: the final message.appended is the record."
fields = [
  { name = "turn_id", type = "u64" },
  { name = "text", type = "string", doc = "the fragment just written, not the whole answer so far" },
]

[[types]]
name = "ModelSelected"
kind = "struct"
doc = "A model choice, and what chose it. Recorded when the choice changes, so the log answers 'why this model?' without a debugger."
fields = [
  { name = "model", type = "string" },
  { name = "previous", type = "string", doc = "the model used before; empty on a session's first call" },
  { name = "rule", type = "string", doc = "the routing rule that fired; empty when the default applied" },
  { name = "context_tokens", type = "u64", doc = "the estimate the decision was made from" },
]

[[types]]
name = "ControlSynced"
kind = "struct"
doc = "The policy pack a session is running on, and whether it was verified. Recorded once per session: this is the local half of 'policy is auditable'."
fields = [
  { name = "issuer", type = "string" },
  { name = "version", type = "string" },
  { name = "key_id", type = "string" },
  { name = "profile", type = "string", doc = "the named profile this session runs" },
  { name = "from_cache", type = "bool", doc = "true when the control plane was unreachable and the last verified pack was used" },
  { name = "note", type = "string", doc = "why the live pack was not used, when it was not" },
]

[[types]]
name = "ProfileSelected"
kind = "struct"
doc = "Which named profile a session runs, with the description the user was shown. Engineers declare intent; the org controls vendors (T-07)."
fields = [
  { name = "profile", type = "string" },
  { name = "description", type = "string" },
  { name = "models", type = "string", doc = "the models behind it, comma separated — transparency without giving away the choice" },
]

[[events]]
name = "control.synced"
payload = "ControlSynced"
ignorable = false

[[events]]
name = "profile.selected"
payload = "ProfileSelected"
ignorable = false

[[events]]
name = "model.selected"
payload = "ModelSelected"
ignorable = false

[[events]]
name = "skills.loaded"
payload = "SkillsLoaded"
ignorable = false

[[events]]
name = "skill.invoked"
payload = "SkillInvoked"
ignorable = false

# ------------------------------------------------------- transient notifications
#
# Server → client, never logged. A reader that misses one has lost nothing: the
# event that follows carries the same content in its final form.

[[notifications]]
name = "model.delta"
payload = "ModelDelta"
transient = true
