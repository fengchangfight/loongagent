[package]
name = "loong-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Terminal client: renders the event stream, sends intents — zero agent logic (ADR-0009)"

[dependencies]
loong-schema.workspace = true
loong-protocol.workspace = true
serde_json.workspace = true

# `libc` is the Unix half of `interrupt()`: `kill(pid, SIGINT)`. Windows uses a
# console control event through kernel32 instead, so the crate is not built there.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
