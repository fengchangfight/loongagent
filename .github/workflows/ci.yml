# The gates, run where they cannot be skipped. `scripts/check.sh` is the same set a
# developer runs locally, so "it passed here" means one thing.
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  # The exact toolchain that produces release artifacts. Cargo.toml pins the
  # channel (`stable`) so a developer's machine needs no network; CI pins the
  # version, because an artifact must be traceable to a compiler.
  RUST_VERSION: "1.99.0"
  # The mirror this project builds against (see DEVELOPMENT.md).
  RUSTUP_DIST_SERVER: https://mirrors.tuna.tsinghua.edu.cn/rustup
  RUSTUP_UPDATE_ROOT: https://mirrors.tuna.tsinghua.edu.cn/rustup/rustup

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The human-written gate diffs against the base commit; a shallow
          # clone would not contain it.
          fetch-depth: 0

      - name: toolchain
        # Mirror first, upstream when the mirror does not carry this version — a
        # Chinese mirror serves the rolling channels, not every `channel-rust-<v>.toml`,
        # which is why this step used to 404 before the code was ever looked at.
        run: ./scripts/install-toolchain.sh

      - name: caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}

      - name: a C compiler, for bundled SQLite and the TLS backend
        run: cc --version

      - name: gates
        env:
          # The base the human-written check compares against: the pull request's
          # base, or the previous commit on a push.
          HUMAN_WRITTEN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: ./scripts/check.sh

  # A tag builds the artifact a colleague installs, rather than a binary from
  # somebody's working tree.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        # Mirror first, upstream when the mirror does not carry this version — a
        # Chinese mirror serves the rolling channels, not every `channel-rust-<v>.toml`,
        # which is why this step used to 404 before the code was ever looked at.
        run: ./scripts/install-toolchain.sh
      - name: artifact
        run: ./scripts/release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: loongagent-release
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
