[package]
name = "loong-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local agent server: JSON-RPC over stdio/unix socket (ADR-0001, ADR-0002)"

[dependencies]
loong-schema.workspace = true
loong-protocol.workspace = true
loong-eventlog.workspace = true
loong-kernel.workspace = true
serde.workspace = true
serde_json.workspace = true

# `libc` is the Unix half of `catch_interrupts`: `signal(SIGINT, …)`. Windows installs
# a console control routine (kernel32) instead, so the crate is not built there.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
loong-providers.workspace = true
loong-hooks.workspace = true
