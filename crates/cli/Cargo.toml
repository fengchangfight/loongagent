[package]
name = "loongagent"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The loongagent binary: server, TUI and (later) web/ACP surfaces in one artifact (ADR-0009)"

[[bin]]
name = "loongagent"
path = "src/main.rs"

[dependencies]
loong-schema.workspace = true
loong-eventlog.workspace = true
loong-kernel.workspace = true
loong-context.workspace = true
loong-providers.workspace = true
loong-server.workspace = true
loong-tui.workspace = true
loong-tui-app.workspace = true
loong-sandbox.workspace = true
loong-hooks.workspace = true
loong-mcp.workspace = true
loong-skills.workspace = true
loong-plugin.workspace = true
loong-config.workspace = true
loong-control.workspace = true
loong-pack.workspace = true
loong-web.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

# `dup2` in `pre_exec`: the private control channel's read end is handed to the server
# child as fd 3. Windows has no descriptor inheritance, and the surface there keeps the
# queued `/yolo` behaviour.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The Windows executable's icon is a resource, not a Rust value: the build script
# compiles `assets/loongagent.rc` with rc.exe (MSVC) or windres (MinGW), and this
# crate knows where those tools hide. Linux builds compile it but never call it.
[build-dependencies]
embed-resource = "3"

[dev-dependencies]
tungstenite = "0.30"
loong-schema.workspace = true
