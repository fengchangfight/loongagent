<!DOCTYPE html>
<!-- Purpose: the web surface's page — banner, rail, chat, and the process panel.
     Serves: the browser, served by `crates/web/src/lib.rs` on `/`.
     Design: `docs/design/web-surface.md` §4.
     Up: `crates/web/src/lib.rs`'s `static_page`.
     Down: `app.js` drives every region; `style.css` styles it.
     Verify: `cargo test -p loong-web` (the page-is-served tests). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>loongagent</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header id="banner">
  <div class="mark">
    <img src="/favicon.png" alt="">
    <span>loongagent</span>
  </div>
  <button id="workspace-btn" title="Switch workspace">
    <span class="icon">📁</span>
    <span class="dir-name">…</span>
    <span class="dir-path"></span>
    <span class="chev">▾</span>
  </button>
  <div class="spacer"></div>
</header>

<nav id="modelbar" aria-label="Models">
  <select id="model-select" aria-label="Model"></select>
  <span class="hint"></span>
</nav>

<div id="body">

  <aside id="rail">
    <div class="rail-head">
      <span>Sessions</span>
      <button id="new-session" title="New session (this workspace)">＋ New</button>
    </div>
    <div id="session-list">
      <div class="empty">Loading…</div>
    </div>
  </aside>

  <main id="chat">
    <div id="transcript">
      <div class="wrap" id="messages">
        <div class="notice info">Connecting…</div>
      </div>
    </div>

    <div id="composer">
      <div class="wrap">
        <form id="composer-form">
          <textarea id="prompt" rows="1" placeholder="Message loongagent…  (Enter to send, Shift+Enter for a newline)"></textarea>
          <button id="send" type="submit">Send</button>
        </form>
        <div id="usage">
          <span class="item">入 <b id="u-in">0</b></span>
          <span class="item">出 <b id="u-out">0</b></span>
          <span class="item">缓存 <b id="u-cached">0</b></span>
          <span class="item">率 <b id="u-rate">—</b></span>
          <span class="item">次 <b id="u-calls">0</b></span>
          <span class="item">上下文 <b id="u-ctx">—</b></span>
          <span class="item">费 <b id="u-cost">$0.00</b></span>
        </div>
      </div>
    </div>

    <div id="status">…</div>
  </main>

</div>

<div id="picker" role="dialog" aria-label="Choose workspace">
  <div class="panel">
    <div class="panel-head">
      <span class="title">Open workspace</span>
      <button class="close" aria-label="Close">✕</button>
    </div>
    <div class="crumbs">
      <button class="up">← up</button>
      <span class="path"></span>
    </div>
    <div class="dirs"><div class="empty">Loading…</div></div>
    <div class="panel-foot">
      <span class="current"></span>
      <button class="choose">Open this directory</button>
    </div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
