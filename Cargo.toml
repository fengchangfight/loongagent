[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.80"
description = "loongagent — a firm-internal coding agent (see docs/)"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

loong-schema = { path = "crates/schema" }
loong-http = { path = "crates/http" }
loong-proc = { path = "crates/proc" }
loong-manifest = { path = "crates/manifest" }
loong-mcp = { path = "crates/mcp" }
loong-skills = { path = "crates/skills" }
toml = "1.1.6"
loong-hooks = { path = "crates/hooks" }
loong-protocol = { path = "crates/protocol" }
loong-eventlog = { path = "crates/eventlog" }
loong-providers = { path = "crates/providers" }
loong-sandbox = { path = "crates/sandbox" }
loong-tools = { path = "crates/tools" }
loong-index = { path = "crates/index" }
loong-kernel = { path = "crates/kernel" }
loong-server = { path = "crates/server" }
loong-tui = { path = "crates/tui" }
loong-tui-app = { path = "crates/tui-app" }
