[workspace]
resolver = "2"
members = ["crates/cli", "crates/config", "crates/context", "crates/control", "crates/eventlog", "crates/hooks", "crates/http", "crates/index", "crates/kernel", "crates/manifest", "crates/mcp", "crates/pack", "crates/plugin", "crates/proc", "crates/protocol", "crates/providers", "crates/sandbox", "crates/schema", "crates/server", "crates/skills", "crates/tools", "crates/tui", "crates/tui-app", "crates/web", "crates/reverse/vendor/loong-reverse-analysis", "crates/reverse/vendor/loong-reverse-disasm", "crates/reverse/vendor/loong-reverse-engine", "crates/reverse/vendor/loong-reverse-evidence", "crates/reverse/vendor/loong-reverse-formats", "crates/reverse/vendor/loong-reverse-js", "crates/reverse/vendor/loong-reverse-mcp", "crates/reverse/vendor/loong-reverse-platform", "crates/reverse/vendor/loong-reverse-testkit", "crates/reverse/mcp-server", "crates/reverse/ui"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.80"
description = "loongagent — a firm-internal coding agent (see docs/)"

# Vendored reverse crates keep craft-anything's lint posture (docs/design/reverse.md).
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Vendored from Craft Anything (docs/superpowers/specs/2026-10-24-loongagent-reverse-design.md).
loong-reverse-evidence = { path = "crates/reverse/vendor/loong-reverse-evidence" }
loong-reverse-platform = { path = "crates/reverse/vendor/loong-reverse-platform" }
loong-reverse-formats = { path = "crates/reverse/vendor/loong-reverse-formats" }
loong-reverse-disasm = { path = "crates/reverse/vendor/loong-reverse-disasm" }
loong-reverse-js = { path = "crates/reverse/vendor/loong-reverse-js" }
loong-reverse-analysis = { path = "crates/reverse/vendor/loong-reverse-analysis" }
loong-reverse-engine = { path = "crates/reverse/vendor/loong-reverse-engine" }
loong-reverse-mcp = { path = "crates/reverse/vendor/loong-reverse-mcp" }
loong-reverse-mcp-lib = { package = "loong-reverse-mcp", path = "crates/reverse/vendor/loong-reverse-mcp" }
loong-reverse-testkit = { path = "crates/reverse/vendor/loong-reverse-testkit" }

# External deps of the vendored reverse crates (pinned to the craft-anything vendor set).
thiserror = "2"
serde_path_to_error = "0.1"
sha2 = "0.10"
hex = "0.4"
bitflags = { version = "2", features = ["serde"] }
schemars = "1"
log = "0.4"
object = { version = "0.36", default-features = false, features = ["read", "std"] }
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "intel", "instr_info"] }
yaxpeax-arm = { version = "0.5", default-features = false, features = ["std", "alloc", "fmt"] }
yaxpeax-arch = { version = "0.3", default-features = false, features = ["std", "alloc"] }
rustc-demangle = "0.1"
wasmparser = { version = "0.261", default-features = false, features = ["std", "validate", "features", "component-model", "simd"] }
wasmprinter = { version = "0.261", default-features = false, features = ["component-model"] }
miniz_oxide = "0.8"
regex = "1"
oxc_allocator = "0.153"
oxc_ast = "0.153"
oxc_ast_visit = "0.153"
oxc_parser = "0.153"
oxc_span = "0.153"
oxc_syntax = "0.153"
oxc_codegen = "0.153"
oxc_semantic = "0.153"

loong-pack = { path = "crates/pack" }
loong-control = { path = "crates/control" }
loong-schema = { path = "crates/schema" }
loong-http = { path = "crates/http" }
loong-proc = { path = "crates/proc" }
loong-manifest = { path = "crates/manifest" }
loong-mcp = { path = "crates/mcp" }
loong-skills = { path = "crates/skills" }
loong-plugin = { path = "crates/plugin" }
loong-config = { path = "crates/config" }
loong-web = { path = "crates/web" }
loong-reverse-ui = { path = "crates/reverse/ui" }
toml = "1.1.6"
loong-hooks = { path = "crates/hooks" }
loong-protocol = { path = "crates/protocol" }
loong-eventlog = { path = "crates/eventlog" }
loong-providers = { path = "crates/providers" }
loong-sandbox = { path = "crates/sandbox" }
loong-tools = { path = "crates/tools" }
loong-index = { path = "crates/index" }
loong-context = { path = "crates/context" }
loong-kernel = { path = "crates/kernel" }
loong-server = { path = "crates/server" }
loong-tui = { path = "crates/tui" }
loong-tui-app = { path = "crates/tui-app" }
